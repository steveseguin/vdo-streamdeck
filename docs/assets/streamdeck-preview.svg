<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
	<title id="title">VDO.Ninja Stream Deck plugin preview</title>
	<desc id="desc">A 15-key Stream Deck running VDO.Ninja controls. Each key is a solid state colour with a small badge in the top corner: green with a check for on or ready, dark red with a cross for off or unavailable, grey for inactive, and amber for a custom API command. Keys shown include connection status, local mic and camera, guest mic and camera, scene membership, mixer layouts, mute all, guest selection, PTZ, solo, and a custom command.</desc>
	<defs>
		<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
			<stop offset="0" stop-color="#0f172a" />
			<stop offset="1" stop-color="#111827" />
		</linearGradient>
		<linearGradient id="deck" x1="0" x2="0" y1="0" y2="1">
			<stop offset="0" stop-color="#1f2937" />
			<stop offset="1" stop-color="#0b1220" />
		</linearGradient>
		<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity="0.35" />
		</filter>
		<style>
			.text { font-family: "Segoe UI", Arial, sans-serif; fill: #e5e7eb; }
			.muted { fill: #94a3b8; }
			.key-title { font-size: 17px; font-weight: 700; text-anchor: middle; fill: #ffffff; }
			.key-sub { font-size: 12px; text-anchor: middle; fill: #e8eef8; }
			.badge { font-size: 15px; font-weight: 700; }
			.caption { font-size: 18px; fill: #cbd5e1; }
		</style>

		<!-- Badge glyphs, matching the corner badges the plugin renders on real keys. -->
		<g id="badge-check" stroke-width="3.6" fill="none" stroke-linecap="round">
			<path d="M54.2 18.6 58.1 22.5 66.1 14.2" />
		</g>
		<g id="badge-cross" stroke-width="3.6" fill="none" stroke-linecap="round">
			<path d="M55 13.3 65 23.3 M65 13.3 55 23.3" />
		</g>
		<g id="badge-grid">
			<rect x="53.65" y="11.95" width="4.8" height="4.8" rx="1.3" />
			<rect x="61.55" y="11.95" width="4.8" height="4.8" rx="1.3" />
			<rect x="53.65" y="19.85" width="4.8" height="4.8" rx="1.3" />
			<rect x="61.55" y="19.85" width="4.8" height="4.8" rx="1.3" />
		</g>
		<g id="badge-bolt">
			<polygon points="61.9,11.1 55.3,19.1 59.2,19.1 58.1,25.5 64.7,17.5 60.8,17.5" />
		</g>
	</defs>

	<rect width="1200" height="720" fill="url(#bg)" />
	<circle cx="1020" cy="90" r="210" fill="#0ea5e9" opacity="0.08" />
	<circle cx="1110" cy="620" r="260" fill="#22c55e" opacity="0.07" />

	<g filter="url(#shadow)">
		<rect x="56" y="140" width="564" height="408" rx="40" fill="url(#deck)" stroke="#334155" />
		<rect x="84" y="168" width="508" height="308" rx="26" fill="#020617" stroke="#111827" />

		<!-- Row 1: connection and local controls -->
		<g transform="translate(98 182)">
			<rect width="80" height="80" rx="14" fill="#0f6b41" />
			<circle cx="60" cy="18.3" r="12.8" fill="#35d07f" />
			<use href="#badge-check" stroke="#06301d" />
			<text class="text key-title" x="40" y="44">VDO</text>
			<text class="key-sub" x="40" y="60">Ready</text>
		</g>
		<g transform="translate(198 182)">
			<rect width="80" height="80" rx="14" fill="#0f6b41" />
			<circle cx="60" cy="18.3" r="12.8" fill="#35d07f" />
			<use href="#badge-check" stroke="#06301d" />
			<text class="text key-title" x="40" y="44">Mic</text>
			<text class="key-sub" x="40" y="60">On</text>
		</g>
		<g transform="translate(298 182)">
			<rect width="80" height="80" rx="14" fill="#0f6b41" />
			<circle cx="60" cy="18.3" r="12.8" fill="#35d07f" />
			<use href="#badge-check" stroke="#06301d" />
			<text class="text key-title" x="40" y="44">Cam</text>
			<text class="key-sub" x="40" y="60">On</text>
		</g>
		<g transform="translate(398 182)">
			<rect width="80" height="80" rx="14" fill="#0f6b41" />
			<circle cx="60" cy="18.3" r="12.8" fill="#35d07f" />
			<use href="#badge-check" stroke="#06301d" />
			<text class="text key-title" x="40" y="44">G1 Mic</text>
			<text class="key-sub" x="40" y="60">On</text>
		</g>
		<g transform="translate(498 182)">
			<rect width="80" height="80" rx="14" fill="#4a1d23" />
			<circle cx="60" cy="18.3" r="12.8" fill="#f87171" />
			<use href="#badge-cross" stroke="#3a0f14" />
			<text class="text key-title" x="40" y="44">G2 Mic</text>
			<text class="key-sub" x="40" y="60">Off</text>
		</g>

		<!-- Row 2: scenes and mixer -->
		<g transform="translate(98 282)">
			<rect width="80" height="80" rx="14" fill="#0f6b41" />
			<circle cx="60" cy="18.3" r="12.8" fill="#35d07f" />
			<use href="#badge-check" stroke="#06301d" />
			<text class="text key-title" x="40" y="44">Scene 1</text>
			<text class="key-sub" x="40" y="60">In</text>
		</g>
		<g transform="translate(198 282)">
			<rect width="80" height="80" rx="14" fill="#4a1d23" />
			<circle cx="60" cy="18.3" r="12.8" fill="#f87171" />
			<use href="#badge-cross" stroke="#3a0f14" />
			<text class="text key-title" x="40" y="44">Scene 2</text>
			<text class="key-sub" x="40" y="60">Out</text>
		</g>
		<g transform="translate(298 282)">
			<rect width="80" height="80" rx="14" fill="#0f6b41" />
			<circle cx="60" cy="18.3" r="12.8" fill="#35d07f" />
			<use href="#badge-grid" fill="#06301d" />
			<text class="text key-title" x="40" y="44">Auto</text>
			<text class="key-sub" x="40" y="60">Layout</text>
		</g>
		<g transform="translate(398 282)">
			<rect width="80" height="80" rx="14" fill="#1e2532" />
			<circle cx="60" cy="18.3" r="12.8" fill="#94a3b8" />
			<use href="#badge-grid" fill="#141a24" />
			<text class="text key-title" x="40" y="44">Grid</text>
			<text class="key-sub" x="40" y="60">Layout</text>
		</g>
		<g transform="translate(498 282)">
			<rect width="80" height="80" rx="14" fill="#0f6b41" />
			<circle cx="60" cy="18.3" r="12.8" fill="#35d07f" />
			<use href="#badge-grid" fill="#06301d" />
			<text class="text key-title" x="40" y="44">Mute</text>
			<text class="key-sub" x="40" y="60">All On</text>
		</g>

		<!-- Row 3: targeting, PTZ, and raw API -->
		<g transform="translate(98 382)">
			<rect width="80" height="80" rx="14" fill="#0f6b41" />
			<circle cx="60" cy="18.3" r="12.8" fill="#35d07f" />
			<use href="#badge-check" stroke="#06301d" />
			<text class="text key-title" x="40" y="44">Next</text>
			<text class="key-sub" x="40" y="60">Guest</text>
		</g>
		<g transform="translate(198 382)">
			<rect width="80" height="80" rx="14" fill="#4a1d23" />
			<circle cx="60" cy="18.3" r="12.8" fill="#f87171" />
			<use href="#badge-cross" stroke="#3a0f14" />
			<text class="text key-title" x="40" y="44">G3 Cam</text>
			<text class="key-sub" x="40" y="60">Off</text>
		</g>
		<g transform="translate(298 382)">
			<rect width="80" height="80" rx="14" fill="#0f6b41" />
			<circle cx="60" cy="18.3" r="12.8" fill="#35d07f" />
			<use href="#badge-check" stroke="#06301d" />
			<text class="text key-title" x="40" y="44">PTZ</text>
			<text class="key-sub" x="40" y="60">Zoom +</text>
		</g>
		<g transform="translate(398 382)">
			<rect width="80" height="80" rx="14" fill="#0f6b41" />
			<circle cx="60" cy="18.3" r="12.8" fill="#35d07f" />
			<use href="#badge-check" stroke="#06301d" />
			<text class="text key-title" x="40" y="44">Solo</text>
			<text class="key-sub" x="40" y="60">G1</text>
		</g>
		<g transform="translate(498 382)">
			<rect width="80" height="80" rx="14" fill="#252d3d" />
			<circle cx="60" cy="18.3" r="12.8" fill="#fbbf24" />
			<use href="#badge-bolt" fill="#3a2606" />
			<text class="text key-title" x="40" y="44">Send</text>
			<text class="key-sub" x="40" y="60">Cmd</text>
		</g>

		<rect x="258" y="548" width="160" height="12" rx="6" fill="#111827" />
	</g>

	<g transform="translate(660 140)">
		<rect x="0" y="0" width="420" height="54" rx="27" fill="#0b1220" stroke="#1f2937" />
		<circle cx="29" cy="27" r="11" fill="#35d07f" />
		<text class="text badge" x="52" y="33">Native Stream Deck controls for VDO.Ninja</text>

		<text class="text" x="0" y="132" font-size="50" font-weight="800">Production controls</text>
		<text class="text" x="0" y="190" font-size="50" font-weight="800">on keys and dials</text>

		<text class="caption" x="0" y="240">Connect to any VDO.Ninja page opened with</text>
		<text class="caption" x="0" y="268">a private API key and control the show.</text>

		<g transform="translate(0 306)">
			<rect x="0" y="0" width="148" height="42" rx="21" fill="#0f6b41" />
			<text class="text badge" x="24" y="27">Mic / camera</text>
			<rect x="164" y="0" width="136" height="42" rx="21" fill="#1e2532" />
			<text class="text badge" x="188" y="27">Guest scenes</text>
			<rect x="316" y="0" width="122" height="42" rx="21" fill="#0f6b41" />
			<text class="text badge" x="340" y="27">PTZ dials</text>
			<rect x="0" y="54" width="128" height="42" rx="21" fill="#1e2532" />
			<text class="text badge" x="24" y="81">Mixer slots</text>
			<rect x="144" y="54" width="150" height="42" rx="21" fill="#4a1d23" />
			<text class="text badge" x="168" y="81">Mute all guests</text>
			<rect x="310" y="54" width="154" height="42" rx="21" fill="#252d3d" />
			<text class="text badge" x="334" y="81">Custom API</text>
		</g>

		<g transform="translate(0 440)">
			<rect x="0" y="0" width="490" height="86" rx="18" fill="#0b1220" stroke="#233044" />
			<text class="muted text" x="24" y="34" font-size="18">Example:</text>
			<text class="text" x="24" y="63" font-size="20" font-family="Consolas, monospace">https://vdo.ninja/?director=ROOM&amp;api=KEY</text>
		</g>
	</g>
</svg>
